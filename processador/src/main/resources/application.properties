spring.application.name=processador

#Database
spring.datasource.url=jdbc:postgresql://localhost:5433/pedido-api
spring.datasource.username=postgres
spring.datasource.password=postgres

#JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=localhost
spring.rabbitmq.username=rabbitmq
spring.rabbitmq.password=rabbitmq
spring.rabbitmq.port=5672

rabbitmq.exchange.name=pedidos.v1.pedido-criado
rabbitmq.queue.name=pedidos.v1.pedido.criado.gerar-processamento
spring.rabbitmq.template.default-reply-receive-timeout=5000
spring.rabbitmq.listener.simple.mismatch-requeue-false=false

# Port
server.port=8081
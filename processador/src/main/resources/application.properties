spring.application.name=processador

#Database
spring.datasource.url=jdbc:postgresql://localhost:5433/pedido-api
spring.datasource.username=postgres
spring.datasource.password=postgres

#JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#rabbitmq config
spring.rabbitmq.host=localhost
spring.rabbitmq.username=rabbitmq
spring.rabbitmq.password=rabbitmq
spring.rabbitmq.port=5672

#rabbitmqQueue
rabbitmq.exchange.name=pedidos.v1.pedido-criado
rabbitmq.exchange.dlx.name=pedidos.v1.pedido-criado.dlx

rabbitmq.queue.name=pedidos.v1.pedido.criado.gerar-processamento
rabbitmq.queue.dlq.name=pedidos.v1.pedido.criado.gerar-processamento.dlq

spring.rabbitmq.template.default-reply-receive-timeout=5000
spring.rabbitmq.listener.simple.mismatch-requeue-false=false

#retry de mensageria
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=30s
spring.rabbitmq.listener.simple.retry.multiplier=2

# Port
server.port=8081